<text x="750" y="328" font-size="15" fill="#94600e">3. Poprawiono kod i kandydata.</text>
<text x="750" y="368" font-size="15" fill="#168561">4. Ponowne kontrole: PASS.</text>
<text x="750" y="416" font-size="15">Dalsze etapy czekają.</text>
<text x="750" y="448" font-size="15">PASS nie oznacza APPROVED.</text>
